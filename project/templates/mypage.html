<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: #eef4ff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        .form-control {
            height: 45px;
            padding-left: 40px;
            border-radius: 10px;
        }

        .form-control::placeholder {
            color: #bbb;
        }

        .form-icon {
            position: absolute;
            top: 11px;
            left: 15px;
            color: #999;
        }

        .search-button {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            border: none;
            background-color: #5c9fff;
            color: white;
            border-radius: 0 10px 10px 0;
            width: 40px;
        }

        .btn-submit {
            background-color: #6ca9ff;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            height: 48px;
            font-size: 18px;
            line-height: 48px;
            padding: 0;
            text-align: center;
        }

        .btn-submit:hover {
            background-color: #4d91f7;
        }

        .btn-wrap {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-wrap .btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>마이페이지</h2>
        <form method="POST" action="/mypage" id="mypage-form">
            <div class="form-group">
                <i class="fas fa-user form-icon"></i>
                <input type="text" class="form-control" name="userid" value="{{ user.userid }}" readonly>
            </div>

            <div class="form-group">
                <i class="fas fa-envelope form-icon"></i>
                <input type="email" class="form-control editable" name="email" value="{{ user.email }}" readonly>
            </div>

            <div class="form-group">
                <label class="mb-1">생년월일:</label>
                <input type="date" class="form-control editable" name="birthdate" value="{{ user.birthdate }}" readonly>
            </div>

            <div class="form-group">
                <i class="fas fa-phone form-icon"></i>
                <input type="text" class="form-control editable" name="phone" value="{{ user.phone }}" readonly>
            </div>

            <div class="form-group">
                <i class="fas fa-map-marker-alt form-icon"></i>
                <input type="text" class="form-control editable" name="address" value="{{ user.address }}" readonly>
                <button type="button" class="search-button"><i class="fas fa-search"></i></button>
            </div>

            <div class="form-group">
                <input type="text" class="form-control editable" name="detail_address" value="{{ user.detail_address }}" readonly>
            </div>

            <div class="btn-wrap">
                <a href="/password_change" class="btn btn-submit">비밀번호 변경</a>
                <button type="button" class="btn btn-submit" id="edit-btn" onclick="toggleEdit()">수정하기</button>
            </div>
        </form>
    </div>

    <script>
        function toggleEdit() {
            const editables = document.querySelectorAll('.editable');
            const button = document.getElementById('edit-btn');
            const form = document.getElementById('mypage-form');

            const isReadOnly = editables[0].hasAttribute('readonly');

            if (isReadOnly) {
                // 수정 가능하게 전환
                editables.forEach(input => input.removeAttribute('readonly'));
                button.innerText = '수정완료';
            } else {
                // 수정 완료 → 저장 요청
                form.submit();
            }
        }
    </script>
</body>
</html>
